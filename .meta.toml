# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.1"

[gitignore]
extra_lines = """
# buildout local dev (Makefile)
.plone-version
.plone.versioncheck.tracked.json
.python-version
CACHEDIR.TAG
src/*
!src/collective
htmlcov/
*.log
output.xml
report.html
"""

[tox]
use_mxdev = true
test_matrix = {"6.2" = ["*"]}
test_deps_additional = """
collective.contact.widget @ file://{toxinidir}/sources/collective.contact.widget
    collective.js.tooltipster @ file://{toxinidir}/sources/collective.js.tooltipster
    imio.fpaudit @ file://{toxinidir}/sources/imio.fpaudit
    plone.formwidget.masterselect @ file://{toxinidir}/sources/plone.formwidget.masterselect
"""

[pyproject]
codespell_ignores = "sergent,fonction"
dependencies_ignores = "['collective.excelexport']"
