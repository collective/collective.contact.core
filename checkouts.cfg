[buildout]
always-checkout = force
auto-checkout +=
    collective.contact.widget
    collective.js.tooltipster
    imio.fpaudit
    plone.formwidget.masterselect

[remotes]
imio = https://github.com/imio
imio_push = git@github.com:imio
plone = https://github.com/plone
plone_push = git@github.com:plone
ftw = https://github.com/4teamwork
ftw_push = git@github.com:4teamwork
zopefoundation = https://github.com/zopefoundation
zopefoundation_push = git@github.com:zopefoundation
zopesvn = svn://svn.zope.org/repos/main/
collective = https://github.com/collective
collective_push = git@github.com:collective

[sources]
imio.fpaudit = git ${remotes:imio}/imio.fpaudit.git pushurl=${remotes:imio_push}/imio.fpaudit.git
collective.contact.widget = git ${remotes:collective}/collective.contact.widget pushurl=${remotes:collective_push}/collective.contact.widget.git branch=python3-chris-adam
collective.js.tooltipster = git ${remotes:collective}/collective.js.tooltipster pushurl=${remotes:collective_push}/collective.js.tooltipster.git branch=plone61-chris-adam
plone.formwidget.masterselect = git ${remotes:collective}/plone.formwidget.masterselect.git pushurl=${remotes:collective_push}/plone.formwidget.masterselect.git
